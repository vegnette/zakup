<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учет склада и закупок</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d23;
    --text: #e8eaed;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --accent-hover: #3b6fdb;
    --green: #22c55e;
    --red: #ef4444;
    --border: #2a2e37;
    --input-bg: #0f1115;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto; padding: 16px; max-width: 600px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4;
  }
  h1 { font-size: 22px; margin: 8px 0 16px; display: flex; align-items: center; gap: 8px; }
  
  .tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    background: #000; padding: 4px; border-radius: 12px;
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; border: none;
    background: transparent; border-radius: 9px; font-size: 14px;
    font-weight: 600; color: var(--muted); cursor: pointer; transition: 0.2s;
  }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  
  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .total-card {
    background: var(--card); border: 1px solid var(--border);
    color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .total-card .label { font-size: 13px; opacity: 0.8; margin-bottom: 6px; font-weight: 500; }
  .total-card .value { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
  
  .total-card.purchase { border-left: 4px solid var(--accent); }
  .total-card.stock { border-left: 4px solid var(--green); }

  .form-box {
    background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 500;}
  
  input {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; background: var(--input-bg); color: var(--text); transition: 0.2s;
  }
  input:focus { outline: none; border-color: var(--accent); }
  
  button {
    background: var(--accent); color: #fff; border: none; padding: 12px 16px;
    border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; width: 100%; transition: 0.2s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  button.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--border); }
  button.secondary:hover { background: #2a2e37; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    background: var(--card); border-radius: 12px; padding: 14px;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid var(--border);
  }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 15px; word-break: break-word; }
  .row .detail { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .row .sum { font-weight: 700; font-size: 16px; white-space: nowrap; }
  
  .row .del {
    background: transparent; color: var(--red); border: none;
    font-size: 22px; line-height: 1; padding: 4px 8px; width: auto; cursor: pointer;
  }
  .row .del:hover { background: rgba(239, 68, 68, 0.1); border-radius: 8px; }

  .empty {
    text-align: center; color: var(--muted); padding: 32px 16px;
    font-size: 14px; background: var(--card); border-radius: 12px;
    border: 1px dashed var(--border);
  }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; }
  .loader { text-align: center; padding: 30px; color: var(--accent); font-weight: 500; }
  
  /* Бейджи прибыли */
  .badge {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    font-size: 11px; font-weight: 700; margin-left: 6px;
  }
  .badge.green { background: rgba(34, 197, 94, 0.15); color: var(--green); }
  .badge.red { background: rgba(239, 68, 68, 0.15); color: var(--red); }
  .badge.muted { background: rgba(255, 255, 255, 0.1); color: var(--muted); }
</style>
</head>
<body>

<h1>📦 Учет склада</h1>

<div class="tabs">
  <button class="tab active" data-tab="stock">Склад</button>
  <button class="tab" data-tab="purchase">Закупка</button>
</div>

<!-- ВКЛАДКА: СКЛАД -->
<div class="panel active" id="panel-stock">
  <div class="total-card stock">
    <div class="label">Общая стоимость склада (по ценам продажи)</div>
    <div class="value" id="stock-total">—</div>
  </div>

  <div class="form-box" style="padding: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between;">
    <div style="font-size: 13px; color: var(--muted); flex: 1;">Данные из вашего Cloudflare Worker.</div>
    <button class="secondary" id="reload-btn" style="width: auto; padding: 8px 16px; font-size: 14px;">Обновить</button>
  </div>

  <div class="list" id="stock-list">
    <div class="loader">Загрузка данных...</div>
  </div>
</div>

<!-- ВКЛАДКА: ЗАКУПКА -->
<div class="panel" id="panel-purchase">
  <div class="total-card purchase">
    <div class="label">Планируемая закупка</div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div>
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 2px;">Затраты:</div>
        <div class="value" id="purchase-cost" style="font-size: 20px;">0 ₽</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 2px;">Прибыль:</div>
        <div class="value" id="purchase-profit" style="font-size: 20px; color: var(--green);">0 ₽</div>
      </div>
    </div>
  </div>

  <div class="form-box">
    <div class="form-grid">
      <div class="full">
        <label>Название товара</label>
        <input type="text" id="purchase-name" placeholder="Например, Чехол iPhone 15">
      </div>
      <div>
        <label>Закупка (шт)</label>
        <input type="number" id="purchase-qty" placeholder="0" inputmode="numeric" min="1">
      </div>
      <div>
        <label>Закупочная цена, ₽</label>
        <input type="number" id="purchase-cost-price" placeholder="0" inputmode="numeric" min="0">
      </div>
      <div class="full">
        <label>Розничная цена (за 1 шт), ₽</label>
        <input type="number" id="purchase-retail-price" placeholder="0" inputmode="numeric" min="0">
      </div>
    </div>
    <button id="purchase-add">Добавить в план</button>
  </div>

  <div class="list" id="purchase-list"></div>
</div>

<script>
(() => {
  'use strict';

  const WORKER_URL = 'https://pf-store-orders.vegnette.workers.dev/api/stock';
  const PURCHASE_KEY = 'pf_purchase_plan_v2';

  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const fmt = n => (Number(n) || 0).toLocaleString('ru-RU') + ' ₽';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let stockItems = [];
  let purchase = [];

  // --- Логика Склада ---
  async function loadStock() {
    document.getElementById('stock-total').textContent = '...';
    document.getElementById('stock-list').innerHTML = '<div class="loader">Загрузка из бота...</div>';
    
    try {
      const res = await fetch(WORKER_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error('Ошибка сервера: ' + res.status);
      const data = await res.json();
      
      if (data.error) throw new Error(data.error);
      if (!Array.isArray(data)) throw new Error('Неверный формат данных');

      stockItems = data.map(i => ({
        id: String(i.id ?? i.sku ?? uid()),
        title: i.title || 'Без названия',
        price: num(i.price), // Розничная цена
        stock: num(i.stock)  // Количество
      }));
      
      renderStock();
    } catch (e) {
      document.getElementById('stock-total').textContent = '—';
      document.getElementById('stock-list').innerHTML = `
        <div class="empty">
          <span style="font-size: 24px; display: block; margin-bottom: 8px;">⚠️</span>
          Ошибка загрузки: ${esc(e.message)}<br><br>
          <span style="font-size: 12px;">Убедитесь, что в Worker добавлен маршрут <code>/api/stock</code>.</span>
        </div>`;
    }
  }

  function renderStock() {
    const wrap = document.getElementById('stock-list');
    if (!stockItems.length) {
      wrap.innerHTML = '<div class="empty">Склад пуст (бот вернул пустой массив)</div>';
      document.getElementById('stock-total').textContent = '0 ₽';
      return;
    }
    
    let total = 0;
    wrap.innerHTML = stockItems.map(p => {
      const sum = p.price * p.stock;
      total += sum;
      return `
        <div class="row">
          <div class="info">
            <div class="name">${esc(p.title)}</div>
            <div class="detail">${fmt(p.price)} × ${p.stock} шт</div>
          </div>
          <div class="sum">${fmt(sum)}</div>
        </div>
      `;
    }).join('');
    
    document.getElementById('stock-total').textContent = fmt(total);
  }

  // --- Логика Закупки (ручная) ---
  function loadPurchase() {
    try { purchase = JSON.parse(localStorage.getItem(PURCHASE_KEY)) || []; }
    catch (_) { purchase = []; }
  }

  function savePurchase() {
    localStorage.setItem(PURCHASE_KEY, JSON.stringify(purchase));
  }

  function renderPurchase() {
    const wrap = document.getElementById('purchase-list');
    if (!purchase.length) {
      wrap.innerHTML = '<div class="empty">План закупки пуст.<br>Добавьте товары через форму выше.</div>';
      document.getElementById('purchase-cost').textContent = '0 ₽';
      document.getElementById('purchase-profit').textContent = '0 ₽';
      document.getElementById('purchase-profit').style.color = 'var(--green)';
      return;
    }
    
    let totalCost = 0;
    let totalProfit = 0;

    wrap.innerHTML = purchase.map(it => {
      const costTotal = num(it.costPrice) * num(it.qty);
      const revenue = num(it.retailPrice) * num(it.qty);
      const profit = revenue - costTotal;
      
      // Считаем маржу в процентах от выручки (насколько выгоден товар)
      const marginPercent = revenue > 0 ? (profit / revenue) * 100 : 0;
      // Или можно считать наценку от затрат: (profit / costTotal) * 100
      // Сделаем маржу (какую долю от цены продажи составляет прибыль)
      
      totalCost += costTotal;
      totalProfit += profit;

      const profitClass = profit >= 0 ? 'green' : 'red';
      
      return `
        <div class="row" data-id="${esc(it.id)}">
          <div class="info">
            <div class="name">${esc(it.name)}</div>
            <div class="detail">
              ${it.qty} шт · Закуп: ${fmt(it.costPrice)} · Продажа: ${fmt(it.retailPrice)}
            </div>
            <div class="detail" style="margin-top: 6px;">
              Прибыль: <span class="sum" style="color: var(--${profitClass})">${fmt(profit)}</span>
              <span class="badge ${profitClass}">${marginPercent.toFixed(1)}%</span>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
             <div class="sum" style="font-size: 13px; color: var(--muted);">Затраты: ${fmt(costTotal)}</div>
             <button class="del" title="Удалить">×</button>
          </div>
        </div>
      `;
    }).join('');
    
    document.getElementById('purchase-cost').textContent = fmt(totalCost);
    document.getElementById('purchase-profit').textContent = fmt(totalProfit);
    document.getElementById('purchase-profit').style.color = totalProfit >= 0 ? 'var(--green)' : 'var(--red)';
  }

  function addPurchase() {
    const nameEl = document.getElementById('purchase-name');
    const qtyEl = document.getElementById('purchase-qty');
    const costEl = document.getElementById('purchase-cost-price');
    const retailEl = document.getElementById('purchase-retail-price');
    
    const name = nameEl.value.trim();
    const qty = Math.floor(num(qtyEl.value));
    const costPrice = num(costEl.value);
    const retailPrice = num(retailEl.value);

    if (!name) return alert('Введите название товара');
    if (qty <= 0) return alert('Количество должно быть больше 0');

    purchase.push({ 
      id: uid(), 
      name, 
      qty, 
      costPrice, 
      retailPrice 
    });
    
    savePurchase();
    renderPurchase();
    
    // Очистка полей
    nameEl.value = '';
    qtyEl.value = '';
    costEl.value = '';
    retailEl.value = '';
    nameEl.focus();
  }

  // --- Слушатели событий ---
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  document.getElementById('reload-btn').addEventListener('click', loadStock);
  document.getElementById('purchase-add').addEventListener('click', addPurchase);
  
  document.getElementById('purchase-retail-price').addEventListener('keypress', e => {
    if (e.key === 'Enter') addPurchase();
  });

  // Удаление из закупки
  document.getElementById('purchase-list').addEventListener('click', e => {
    const btn = e.target.closest('button.del');
    if (!btn) return;
    const row = btn.closest('.row');
    purchase = purchase.filter(x => x.id !== row.dataset.id);
    savePurchase();
    renderPurchase();
  });

  // --- Старт ---
  loadPurchase();
  renderPurchase();
  loadStock();
})();
</script>
</body>
</html>
